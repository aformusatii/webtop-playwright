services:
  webtop-playwright:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webtop-playwright
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Chisinau
    ports:
      - 8034:3000
      - 8035:3001
      - 8036:8931
    volumes:
      - ./config:/config
      - ./services:/custom-services.d:ro
      - ./init:/custom-cont-init.d:ro
    shm_size: "1gb"
    restart: unless-stopped
    networks:
      - common-network       # Connect to existing external network (optional)

networks:
  common-network:
    external: true            # Comment this out if you prefer Docker to create its own network
